<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>
    <header class="page-header">
        <h1>Begin your journey with Parakh</h1>
    </header>

    <main class="login-main">

        <div class="login-card">
            <h2>Create Account</h2>
            <p class="login-subtext">Join Parakh in less time than it takes to make maggi!</p>

            <form action="/register" method="POST" class="registerForm" id="registerForm">
                <div class="username">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="password">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" required>
                </div>

                <div class="confirm-password">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="8" required>
                </div>

                <p class="form-error" id="passwordError" style="display: none;"></p>

                <button type="submit">Register</button>
            </form>

            <div class="divider">or</div>

            <div class="new-user">
                <a href="/login">Already have an account? Click to login</a>
            </div>
        </div>
    </main>

    <script>
        const registerForm = document.getElementById("registerForm");
        const passwordError = document.getElementById("passwordError");

        registerForm.addEventListener("submit", function (event) {

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (password.length < 8) {
                event.preventDefault();
                passwordError.textContent = "Password must be at least 8 characters long.";
                passwordError.style.display = "block";
                return;
            }

            if (password !== confirmPassword) {
                event.preventDefault();
                passwordError.textContent = "Passwords do not match.";
                passwordError.style.display = "block";
                return;
            }

            passwordError.style.display = "none";
            // Form submits normally to /register from here
        });
    </script>

</body>

</html>
