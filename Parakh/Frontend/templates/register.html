{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Parakh</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- Toast Popup Notifications -->
    {% if messages %}
    <div id="toast-container" class="toast-container">
        {% for message in messages %}
        <div class="toast-popup toast-{{ message.tags }}">
            <span>{{ message }}</span>
            <button type="button" class="toast-close" onclick="this.parentElement.remove();">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <header class="page-header">
        <h1>Begin your journey with Parakh</h1>
    </header>

    <main class="login-main">
        <div class="login-card">
            <h2>Create Account</h2>
            <p class="login-subtext">Join Parakh in less time than it takes to make maggi!</p>

            <form action="{% url 'register' %}" method="POST" class="registerForm" id="registerForm">
                {% csrf_token %}
                <!-- Step 1: Basic details -->
                <div class="form-step" id="step1">
                    <div class="username">
                        <label for="username">Username<span class="required-asterisk">*</span></label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="email">
                        <label for="email">Email<span class="required-asterisk">*</span></label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="name">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name">
                    </div>

                    <div class="mobile">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number"
                            pattern="[0-9]{10}" title="Enter a valid 10-digit mobile number">
                    </div>

                    <p class="form-error" id="step1Error" style="display: none;"></p>

                    <button type="button" id="nextBtn">Next</button>
                </div>

                <!-- Step 2: Password -->
                <div class="form-step" id="step2" style="display: none;">
                    <div class="password">
                        <label for="password">Password<span class="required-asterisk">*</span></label>
                        <input type="password" id="password" name="password" placeholder="Create a password"
                            minlength="8" required>
                    </div>

                    <div class="confirm-password">
                        <label for="confirm_password">Confirm Password<span class="required-asterisk">*</span></label>
                        <input type="password" id="confirm_password" name="confirm_password"
                            placeholder="Re-enter your password" minlength="8" required>
                    </div>

                    <p class="form-error" id="passwordError" style="display: none;"></p>

                    <div class="form-step-actions">
                        <button type="button" id="backBtn">Back</button>
                        <button type="submit">Register</button>
                    </div>
                </div>
            </form>

            <div class="divider">or</div>

            <div class="new-user">
                <a href="{% url 'login' %}">Already have an account? Click to login</a>
            </div>
        </div>
    </main>

    <script src="{% static 'js/script.js' %}"></script>
    <script>
        const registerForm = document.getElementById("registerForm");
        const step1 = document.getElementById("step1");
        const step2 = document.getElementById("step2");
        const step1Error = document.getElementById("step1Error");
        const passwordError = document.getElementById("passwordError");

        const nextBtn = document.getElementById("nextBtn");
        const backBtn = document.getElementById("backBtn");

        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");

        nextBtn.addEventListener("click", function () {
            if (!usernameInput.value.trim()) {
                step1Error.textContent = "Username is required.";
                step1Error.style.display = "block";
                usernameInput.focus();
                return;
            }

            if (!emailInput.checkValidity()) {
                step1Error.textContent = "Please enter a valid email address.";
                step1Error.style.display = "block";
                emailInput.focus();
                return;
            }

            step1Error.style.display = "none";
            step1.style.display = "none";
            step2.style.display = "block";
        });

        backBtn.addEventListener("click", function () {
            step2.style.display = "none";
            step1.style.display = "block";
        });

        registerForm.addEventListener("submit", function (event) {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm_password").value;

            if (password.length < 8) {
                event.preventDefault();
                passwordError.textContent = "Password must be at least 8 characters long.";
                passwordError.style.display = "block";
                return;
            }

            if (password !== confirmPassword) {
                event.preventDefault();
                passwordError.textContent = "Passwords do not match.";
                passwordError.style.display = "block";
                return;
            }

            passwordError.style.display = "none";
        });
    </script>
</body>
</html>
