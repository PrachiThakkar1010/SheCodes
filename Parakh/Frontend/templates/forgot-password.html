<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Parakh</title>
    <link rel="icon" type="image/png" href="{% static 'images/Logo.png' %}">
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-image">
            <img src="{% static 'Logo.png' %}" alt="Parakh Logo">
        </div>
        <div class="logo">
            <a href="{% url 'home' %}">PARAKH</a>
        </div>
        <nav class="nav-links">
            {% if request.user.is_authenticated %}
            <!-- Logged-in view: Login is hidden; Home, Scan, Rules, and Dashboard profile icon are visible -->
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'scan' %}">Scan</a>
            <a href="{% url 'rules' %}">Rules</a>
            <div class="profile-menu">
                <button type="button" class="profile-icon" aria-haspopup="true" aria-expanded="false"
                    aria-label="Account menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="#073b70" stroke-width="2" />
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#073b70" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
                <div class="profile-dropdown">
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'profile' %}">Profile</a>
                    <a href="{% url 'logout' %}" class="btn-logout-dropdown">Logout</a>
                </div>
            </div>
            {% else %}
            <!-- Guest view: Home, Scan, Rules, and Login are visible; Profile icon is hidden -->
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'scan' %}">Scan</a>
            <a href="{% url 'rules' %}">Rules</a>
            <a href="{% url 'login' %}" class="login-link">Login</a>
            {% endif %}
        </nav>
    </header>

    <main class="login-main">

        <div class="login-card">

            <h2>Forgot Password?</h2>

            <p class="login-subtext" id="instruction">
                Enter your registered username or email to receive an OTP.
            </p>

            <!-- STEP 1: Enter Username / Email -->
            <form id="emailForm" class="loginForm">

                <div class="username">
                    <label for="username">Username or Email</label>

                    <input type="text" id="username" name="username" placeholder="Enter your username or email"
                        required>
                </div>

                <button type="submit">Send OTP</button>

            </form>


            <!-- STEP 2: Enter OTP -->
            <form id="otpForm" class="loginForm" style="display: none;">

                <div class="password">
                    <label for="otp">Enter OTP</label>

                    <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                </div>

                <button type="submit">Verify OTP</button>

                <p class="login-subtext">
                    Didn't receive the OTP?
                    <a href="#" id="resendOtp">Resend OTP</a>
                </p>

            </form>


            <!-- STEP 3: Enter New Password -->
            <form id="newPasswordForm" class="loginForm" style="display: none;">

                <div class="password">
                    <label for="newPassword">New Password</label>

                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password"
                        minlength="8" required>
                </div>

                <div class="password">
                    <label for="confirmNewPassword">Re-enter New Password</label>

                    <input type="password" id="confirmNewPassword" name="confirmNewPassword"
                        placeholder="Re-enter new password" minlength="8" required>
                </div>

                <p class="form-error" id="passwordError" style="display: none;">
                    Passwords do not match.
                </p>

                <button type="submit">Reset Password</button>

            </form>


            <div class="new-user">
                <a href="/login">← Back to Login</a>
            </div>

        </div>

    </main>


    <script>

        const emailForm = document.getElementById("emailForm");
        const otpForm = document.getElementById("otpForm");
        const newPasswordForm = document.getElementById("newPasswordForm");
        const instruction = document.getElementById("instruction");
        const passwordError = document.getElementById("passwordError");

        emailForm.addEventListener("submit", function (event) {

            event.preventDefault();

            // For now, we are only changing the UI.
            // Later Django will actually send the OTP.

            emailForm.style.display = "none";
            otpForm.style.display = "block";

            instruction.textContent =
                "We've sent a 6-digit OTP to your registered email.";

        });


        otpForm.addEventListener("submit", function (event) {

            event.preventDefault();

            // Later Django will verify the OTP here.
            // Only move to step 3 if the backend confirms the OTP is valid.

            otpForm.style.display = "none";
            newPasswordForm.style.display = "block";

            instruction.textContent =
                "OTP verified. Please enter your new password.";

        });


        newPasswordForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmNewPassword = document.getElementById("confirmNewPassword").value;

            if (newPassword !== confirmNewPassword) {
                passwordError.style.display = "block";
                return;
            }

            passwordError.style.display = "none";

            // Later Django will actually update the password here.

            alert("Password reset successfully! Please log in with your new password.");

            // Later redirect to login.html
            // window.location.href = "login.html";

        });


        document.getElementById("resendOtp").addEventListener("click", function (event) {

            event.preventDefault();

            alert("A new OTP has been sent!");

            // Later Django will actually resend the OTP.

        });

    </script>

</body>

</html>
